<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NexeSocial - Accés Protegit</title>
    <link rel="stylesheet" href="style-dashboard.css">
    <style>
        /* Estils originals mantinguts */
        .login-body {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background: url('img/fondo-login.png') no-repeat center center fixed;
            background-size: cover; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px);
            padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 380px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4); transform: translateY(-20px);
            z-index: 10;
        }

        .login-card img { width: 140px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 12px 15px; border: 1.5px solid #e2e8f0;
            border-radius: 10px; font-size: 1rem; box-sizing: border-box; background: rgba(255, 255, 255, 0.5);
        }
        .btn-login {
            width: 100%; padding: 14px; background: #2563eb; color: white; border: none;
            border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; }
        
        #error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; }
        
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            flex-direction: column; z-index: 1000; color: white;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #ffffff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            25% {transform: translateX(-8px);}
            75% {transform: translateX(8px);}
        }

        .main-footer { position: fixed; bottom: 0; width: 100%; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); padding: 15px 0; }
    </style>
</head>
<body class="login-body">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="font-weight: 600; letter-spacing: 0.5px;">Verificant credencials...</p>
    </div>

    <div class="login-card">
        <img src="img/NexeSocial-logo.png" alt="Logo NexeSocial">
        <h2 style="color: #1e293b; margin-bottom: 8px;">Benvingut de nou</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 30px;">Gestió d'usuaris centralitzada</p>
        
        <div class="input-group">
            <label>Correu Electrònic</label>
            <input type="email" id="userInput" placeholder="Ex: admin@nexesocial.com">
        </div>
        
        <div class="input-group">
            <label>Contrasenya</label>
            <input type="password" id="passInput" placeholder="••••••••">
        </div>

        <button class="btn-login" id="btnLogin" onclick="intentarLogin()">Accedir al Sistema</button>
        
        <p id="error-msg">⚠️ Correu o contrasenya incorrectes</p>

        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.05);">
            <p style="font-size: 0.7rem; color: #64748b;">Accés protegit mitjançant Firebase Auth</p>
        </div>
    </div>

    <footer class="main-footer">
        <div style="display: flex; justify-content: space-around; font-size: 0.75rem; color: #475569;">
            <span>© 2026 NexeSocial</span>
            <span>Desenvolupat per <strong>Rafa Campos</strong></span>
        </div>
    </footer>

    <script type="module">
        // 1. Importar Firebase Auth (auth-manager NOT imported on login page — no session timers needed)
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Force session-only persistence: auth token is cleared when browser closes
        // Must be awaited BEFORE subscribing to onAuthStateChanged to avoid race conditions
        await setPersistence(auth, browserSessionPersistence).catch(() => {});

        // Si ja hi ha sessió activa, redirigir directament a home
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';
        const _unsub = onAuthStateChanged(auth, user => {
            _unsub();
            if (user) {
                window.location.replace('home.html');
            } else {
                loader.style.display = 'none';
            }
        });

        async function intentarLogin() {
            const email = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            const btn = document.getElementById('btnLogin');
            const error = document.getElementById('error-msg');
            const card = document.querySelector('.login-card');
            const loader = document.getElementById('loading-overlay');

            if (!email || !pass) {
                alert("Si us plau, omple tots els camps.");
                return;
            }

            try {
                loader.style.display = 'flex';
                btn.disabled = true;
                error.style.display = 'none';

                // Clear stale role/permission data AND session timer keys from previous sessions
                ['userRole','userRoles','userPermissions','userEmail','userName',
                 'nexe_session_start','nexe_last_activity'].forEach(k => localStorage.removeItem(k));

                // 3. Lògica real de Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                
                console.log("✅ Accés concedit per a:", user.email);
                
                // 4. Guardar datos en localStorage
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', user.email.split('@')[0]);
                // Mark session start time for timeout control
                localStorage.setItem('nexe_session_start', String(Date.now()));
                localStorage.setItem('nexe_last_activity', String(Date.now()));
                
                // signInWithEmailAndPassword ya resolvió = sesión establecida, redirigir directamente
                window.location.replace('home.html');

            } catch (err) {
                loader.style.display = 'none';
                btn.disabled = false;
                error.style.display = 'block';
                
                // Animació de sacsejada si falla
                card.style.animation = "shake 0.4s";
                setTimeout(() => { card.style.animation = ""; }, 400);

                console.error("Error en el login:", err.code);
                
                // Missatges d'error més descriptius
                if (err.code === 'auth/invalid-credential') {
                    error.innerText = "⚠️ Credencials incorrectes.";
                } else if (err.code === 'auth/user-not-found') {
                    error.innerText = "⚠️ Aquest usuari no existeix.";
                } else {
                    error.innerText = "⚠️ Error d'accés. Revisa la connexió.";
                }
            }
        }

        // Exposar a l'HTML global
        window.intentarLogin = intentarLogin;

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') intentarLogin();
        });
    </script>

</body>
</html>
