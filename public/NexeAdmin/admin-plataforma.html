    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; margin: 0; display: flex; min-height: 100vh; }
        .main-content { flex: 1; padding: 32px 40px 60px; min-width: 0; }

        h1 { font-size: 1.4rem; font-weight: 800; color: #1e293b; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
        .subtitle { font-size: .85rem; color: #64748b; margin: 0 0 28px; }

        .section { background: white; border: 1.5px solid #e2e8f0; border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
        .section-header { padding: 18px 24px 16px; border-bottom: 1.5px solid #f1f5f9; display: flex; align-items: center; gap: 10px; }
        .section-header h2 { margin: 0; font-size: .95rem; font-weight: 800; color: #1e293b; flex: 1; }
        .section-body { padding: 20px 24px; }

        /* â”€â”€ CONSTRUCTION MODE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        .module-group { margin-bottom: 20px; }
        .module-group-label { font-size: .68rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
        .module-rows { display: flex; flex-direction: column; gap: 4px; }
        .module-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 10px; transition: .12s;
        }
        .module-row:hover { border-color: #94a3b8; background: #fafafa; }
        .module-row.active { border-color: #fbbf24; background: #fffbeb; }
        .row-icon { font-size: 1.05rem; flex-shrink: 0; width: 24px; text-align: center; }
        .row-label { flex: 1; font-size: .84rem; font-weight: 600; color: #1e293b; }
        .row-slug { font-size: .72rem; color: #94a3b8; font-family: monospace; margin-left: 4px; }
        .row-status { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
        .row-status.on  { background: #fef3c7; color: #92400e; }
        .row-status.off { background: #f1f5f9; color: #94a3b8; display: none; }

        /* Toggle switch */
        .toggle-wrap { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle-wrap input { opacity: 0; width: 0; height: 0; }
        .toggle-track { position: absolute; inset: 0; background: #e2e8f0; border-radius: 22px; cursor: pointer; transition: .2s; }
        .toggle-thumb { position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.25); pointer-events: none; }
        input:checked ~ .toggle-track { background: #f59e0b; }
        input:checked ~ .toggle-track + .toggle-thumb,
        input:checked + .toggle-track ~ .toggle-thumb { transform: translateX(18px); }

        /* â”€â”€ IMPERSONATION â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        .search-box { display: flex; align-items: center; gap: 8px; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 8px 14px; background: white; margin-bottom: 14px; }
        .search-box input { border: none; outline: none; font-size: .84rem; font-family: inherit; flex: 1; }
        .user-table { width: 100%; border-collapse: collapse; }
        .user-table th { font-size: .68rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; text-align: left; padding: 6px 10px; border-bottom: 1.5px solid #f1f5f9; }
        .user-table td { padding: 10px 10px; font-size: .83rem; color: #1e293b; border-bottom: 1px solid #f8fafc; vertical-align: middle; }
        .user-table tr:last-child td { border-bottom: none; }
        .user-table tr:hover td { background: #f8fafc; }
        .role-badge { display: inline-flex; padding: 2px 8px; border-radius: 20px; font-size: .68rem; font-weight: 700; }
        .role-admin    { background: #dbeafe; color: #1d4ed8; }
        .role-psicolog { background: #f5f3ff; color: #6d28d9; }
        .role-auditor  { background: #dcfce7; color: #15803d; }
        .role-other    { background: #f1f5f9; color: #475569; }
        .btn-emulate { padding: 5px 13px; background: #f59e0b; color: #1c1917; border: none; border-radius: 7px; font-weight: 700; font-size: .75rem; cursor: pointer; font-family: inherit; white-space: nowrap; transition: .12s; }
        .btn-emulate:hover { background: #d97706; }

        .btn { padding: 9px 18px; border: none; border-radius: 9px; font-weight: 700; font-size: .84rem; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: inherit; transition: .15s; }
        .btn-ghost { background: #f1f5f9; color: #475569; }
        .btn-ghost:hover { background: #e2e8f0; }
        .empty-note { text-align: center; color: #94a3b8; font-size: .83rem; padding: 24px 0; }
        #status-msg { font-size: .78rem; color: #64748b; margin-top: 8px; min-height: 18px; }
    </style>
</head>

let _pagesMap   = {}; // slug â†’ bool (active)
let _allUsers   = [];
let _myEmail    = '';

async function init() {
    // Load construction mode state
    const snap = await getDoc(doc(db, 'platform_settings', 'construction_mode')).catch(() => null);
    _pagesMap   = snap?.exists() ? (snap.data().pages || {}) : {};

    // Current user email (to skip in impersonation list)
    _myEmail = auth.currentUser?.email || '';

    renderConstruction();
    await loadUsers();
}

// â”€â”€ Construction mode â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderConstruction() {
    const body = document.getElementById('construction-body');
    let html = '';
    let activeCount = 0;

    PAGES.forEach(group => {
        html += `<div class="module-group">
            <div class="module-group-label">${group.group}</div>
            <div class="module-rows">`;
        group.pages.forEach(p => {
            const on = !!_pagesMap[p.slug];
            if (on) activeCount++;
            html += `<div class="module-row ${on ? 'active' : ''}" id="row-${CSS.escape(p.slug)}">
                <span class="row-icon" style="color:#64748b;display:flex;align-items:center;">${p.icon}</span>
                <span class="row-label">${p.label} <span class="row-slug">${p.slug.split('/').pop()}</span></span>
                <span class="row-status ${on ? 'on' : 'off'}" id="status-${CSS.escape(p.slug)}">${on ? 'En construcciÃ³' : ''}</span>
                <label class="toggle-wrap">
                    <input type="checkbox" ${on ? 'checked' : ''} onchange="togglePage('${p.slug}',this)">
                    <span class="toggle-track"></span>
                    <span class="toggle-thumb"></span>
                </label>
            </div>`;
        });
        html += `</div></div>`;
    });

    body.innerHTML = html;
    updateActiveCount(activeCount);
}

function updateActiveCount(n) {
    const el = document.getElementById('active-count');
    el.textContent = n === 0 ? 'Cap mÃ²dul actiu' : `${n} mÃ²dul${n > 1 ? 's' : ''} en construcciÃ³`;
    el.style.background = n > 0 ? '#fef3c7' : '#f1f5f9';
    el.style.color      = n > 0 ? '#92400e' : '#94a3b8';
}

window.togglePage = async function(slug, checkbox) {
    const on  = checkbox.checked;
    const row = document.getElementById('row-' + CSS.escape(slug));
    const st  = document.getElementById('status-' + CSS.escape(slug));
    const msg = document.getElementById('status-msg');

    _pagesMap[slug] = on;
    row?.classList.toggle('active', on);
    if (st) { st.textContent = on ? 'En construcciÃ³' : ''; st.className = 'row-status ' + (on ? 'on' : 'off'); }
    msg.textContent = 'Desant...';

    try {
        await setDoc(doc(db, 'platform_settings', 'construction_mode'), { pages: _pagesMap }, { merge: true });
        const active = Object.values(_pagesMap).filter(Boolean).length;
        updateActiveCount(active);
        msg.textContent = `âœ“ ${slug.split('/').pop()} â€” ${on ? 'activat' : 'desactivat'}`;
        setTimeout(() => msg.textContent = '', 3000);
    } catch(e) {
        _pagesMap[slug] = !on;
        checkbox.checked = !on;
        row?.classList.toggle('active', !on);
        msg.textContent = 'Error: ' + e.message;
    }
};

// â”€â”€ Users â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function loadUsers() {
    try {
        const snap = await getDocs(query(collection(db, 'usuarios'), orderBy('email', 'asc')));
        _allUsers = [];
        snap.forEach(d => {
            const u = d.data();
            _allUsers.push({
                id:    d.id,
                email: u.email || d.id,
                name:  u.nombre || u.name || '',
                role:  u.role || u.rol || 'user',
                perms: u.permisos || {}
            });
        });
        renderUsers(_allUsers);
    } catch(e) {
        document.getElementById('user-list-body').innerHTML =
            `<tr><td colspan="4" class="empty-note">Error: ${e.message}</td></tr>`;
    }
}

function roleBadge(role) {
    const map = { admin:'role-admin', superadmin:'role-admin', psicolog:'role-psicolog', auditor:'role-auditor' };
    return `<span class="role-badge ${map[role]||'role-other'}">${role}</span>`;
}

function renderUsers(list) {
    const tbody = document.getElementById('user-list-body');
    const filtered = list.filter(u => u.email !== _myEmail);
    if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-note">Sense usuaris</td></tr>`;
        return;
    }
    tbody.innerHTML = filtered.map(u => `
        <tr>
            <td style="font-weight:700;">${u.name || u.email.split('@')[0]}</td>
            <td style="color:#64748b;">${u.email}</td>
            <td>${roleBadge(u.role)}</td>
            <td style="text-align:right;">
                <button class="btn-emulate" onclick="startImpersonation('${u.email}','${u.role}','${encodeURIComponent(JSON.stringify(u.perms))}','${u.name.replace(/'/g,"\\'")}')">Emular</button>
            </td>
        </tr>`).join('');
}

window.filterUsers = function() {
    const q = document.getElementById('user-search').value.trim().toLowerCase();
    renderUsers(q ? _allUsers.filter(u =>
        u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.role.toLowerCase().includes(q)
    ) : _allUsers);
};

window.startImpersonation = async function(email, role, permsEncoded, name) {
    const perms = JSON.parse(decodeURIComponent(permsEncoded));
    // Ensure Auth is fully ready before impersonating
    if (!window.Auth?.isReady) await window.Auth.initialize();
    window.Auth._startImpersonation(email, role, perms, name);
};
