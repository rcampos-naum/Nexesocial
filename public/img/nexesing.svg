<svg width="450" height="120" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="singGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Documento base -->
    <rect x="5" y="8" width="35" height="48" rx="2" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Líneas del documento -->
    <line x1="10" y1="16" x2="36" y2="16" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="10" y1="23" x2="36" y2="23" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="10" y1="30" x2="36" y2="30" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Firma ondulada -->
    <path d="M10 42 Q15 35 20 42 T30 42" fill="none" stroke="url(#singGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Punto de pluma -->
    <circle cx="30" cy="42" r="2" fill="url(#singGrad)"/>
  </g>

  <text x="120" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">
    <tspan fill="#0F172A">Nexe</tspan><tspan fill="#10b981">Sing</tspan>
  </text>
  
  <text x="122" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" letter-spacing="1.5">
    SUITE DE FIRMES
  </text>
  
  <rect x="122" y="102" width="40" height="3" rx="1.5" fill="#10b981" opacity="0.3"/>
</svg>
