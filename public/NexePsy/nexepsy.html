<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/svg+xml" href="../img/NexePsy-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script type="module" src="../database.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; background-color: #f8fafc; color: #1e293b; 
            font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; 
        }

        .main-content {
            flex-grow: 1;
            margin-left: 280px; 
            padding: 40px 60px;
            max-width: 100%;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.collapsed .main-content { margin-left: 85px; }

        .search-container { margin-bottom: 35px; position: relative; display: flex; gap: 10px; max-width: 800px; }
        .search-input { 
            flex-grow: 1; padding: 16px 20px 16px 50px; border-radius: 18px; border: 2px solid #e2e8f0;
            background: white; font-size: 1rem; outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 25px; margin-bottom: 80px; }
        
        .case-card { 
            background: white; border-radius: 28px; padding: 35px; 
            border: 1px solid #e2e8f0; transition: 0.3s; position: relative;
            display: flex; flex-direction: column;
            cursor: pointer; /* Indica que la targeta Ã©s clicable */
        }
        
        .case-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.05); border-color: #6366f1; }
        .case-id { font-size: 0.75rem; font-weight: 800; color: #6366f1; margin-bottom: 10px; text-transform: uppercase; }
        .case-card h3 { font-size: 1.5rem; margin: 0 0 15px; font-weight: 800; color: #0f172a; letter-spacing: -0.03em; }
        .case-card p { color: #64748b; font-size: 0.95rem; line-height: 1.6; margin-bottom: 30px; flex-grow: 1; }

        .btn-nexe-sm { 
            display: inline-flex !important;
            align-items: center; 
            justify-content: center;
            padding: 14px 24px; 
            border-radius: 15px; 
            font-weight: 700; 
            font-size: 0.85rem; 
            border: none; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            text-decoration: none !important;
            text-align: center;
        }

        .btn-psy-primary { background: #6366f1 !important; color: white !important; }
        .btn-psy-secondary { background: #f1f5f9 !important; color: #475569 !important; }
        .btn-psy-dark { background: #0f172a !important; color: white !important; }
        
        .btn-nexe-sm:hover { opacity: 0.9; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .main-content { margin-left: 0 !important; padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px;">
            <div>
                <span style="color: #6366f1; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">GestiÃ³ de Casos</span>
                <h1 style="font-size: 2.8rem; font-weight: 800; margin: 8px 0 0; letter-spacing: -0.05em; color: #0f172a;">Seguiment Actiu</h1>
            </div>
            <div style="display:flex;gap:10px;">
                <a href="nexepsy-exp.html" class="btn-nexe-sm" style="background:#ede9fe;color:#6366f1;text-decoration:none;display:inline-flex;align-items:center;gap:8px;" onclick="event.preventDefault();openBeneficiariSearch()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                    Expedient per beneficiari
                </a>
                <button onclick="alert('Funcionalitat en desenvolupament')" class="btn-nexe-sm btn-psy-dark">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" stroke-width="3" style="margin-right: 8px;"><path d="M12 4v16m8-8H4" stroke-linecap="round"/></svg>
                    Nova Alta
                </button>
            </div>
        </header>

        <div class="search-container">
            <svg class="search-icon" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"/></svg>
            <input type="text" id="mainSearch" class="search-input" placeholder="Cerca cognoms o expedient..." onkeyup="filtrarCasos()">
        </div>

        <div class="case-grid" id="caseContainer"></div>
    </main>

    <script src="sidebar-nexepsy.js"></script>
    <script src="../security-check.js"></script>

    <script>
        // L'accÃ©s es valida de forma centralitzada des de security-check.js.

        // â”€â”€ Dades en memÃ²ria (poblades pel mÃ²dul Firestore) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        let _families = [];

        function cargarCasos(families, filtro = "") {
            _families = families;
            _renderFamilies(filtro);
        }

        function _renderFamilies(filtro = "") {
            const container = document.getElementById('caseContainer');
            if (!container) return;
            const q = filtro.toLowerCase();
            const filtrats = q
                ? _families.filter(f =>
                    (f.apellido||'').toLowerCase().includes(q) ||
                    (f.id||'').toLowerCase().includes(q) ||
                    (f.notas||'').toLowerCase().includes(q))
                : _families;

            if (filtrats.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1;padding:60px;text-align:center;color:#94a3b8;">
                    <div style="margin-bottom:12px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
                    <div style="font-weight:700;">Cap expedient trobat</div>
                    <div style="font-size:.85rem;margin-top:6px;">Prova amb altres paraules de cerca</div></div>`;
                return;
            }

            container.innerHTML = '';
            filtrats.forEach(f => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = (e) => {
                    if (!e.target.closest('.btn-nexe-sm')) {
                        window.location.href = `nexepsy-exp.html?id=${encodeURIComponent(f.id)}`;
                    }
                };
                const programesHtml = (f.programes||[]).slice(0,2).map(p =>
                    `<span style="background:#ede9fe;color:#6366f1;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;">${p}</span>`
                ).join('');
                const estatColor = f.estat === 'activa' ? '#d1fae5' : f.estat === 'inactiva' ? '#f1f5f9' : '#fef3c7';
                const estatText  = f.estat === 'activa' ? '#065f46' : f.estat === 'inactiva' ? '#64748b' : '#92400e';

                card.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                        <span class="case-id">${f.id}</span>
                        <span style="background:${estatColor};color:${estatText};padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:800;text-transform:uppercase;">${f.estat||'activa'}</span>
                    </div>
                    <h3>FamÃ­lia ${f.apellido||'â€”'}</h3>
                    <p>${f.notas || (f.programes?.length ? 'Programes: ' + f.programes.join(', ') : 'Sense observacions registrades.')}</p>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;">${programesHtml}</div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                        <a href="../informe-psicosocial.html?famId=${encodeURIComponent(f.id)}&name=${encodeURIComponent(f.apellido||'')}"
                           onclick="prepararAcceso('${f.id}','${(f.apellido||'').replace(/'/g,"\\'")}')"
                           class="btn-nexe-sm btn-psy-primary">Nou Informe</a>
                        <a href="../genograma_editor.html?famId=${encodeURIComponent(f.id)}"
                           class="btn-nexe-sm btn-psy-secondary">Genograma</a>
                    </div>`;
                container.appendChild(card);
            });
        }

        function filtrarCasos() {
            _renderFamilies(document.getElementById('mainSearch').value);
        }

        function prepararAcceso(id, cognoms) {
            const user = (typeof Auth !== 'undefined') ? Auth.getUser() : null;
            localStorage.setItem('familia_data', JSON.stringify({
                id, apellidos: cognoms,
                tecnico: user ? (user.nombre||'') + ' ' + (user.apellidos||'') : 'Professional NexePsy'
            }));
        }

        // â”€â”€ Cerca beneficiari â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        let _benCarregats = false;

        window.openBeneficiariSearch = function() {
            document.getElementById('modal-cerca-ben').style.display = 'flex';
            document.getElementById('cerca-ben-input').value = '';
            document.getElementById('cerca-ben-results').innerHTML =
                '<p style="color:#94a3b8;padding:20px;text-align:center;">Escriu per cercar...</p>';
            if (!_benCarregats) _carregarBeneficiaris();
        };
        window.closeBenSearch = function() {
            document.getElementById('modal-cerca-ben').style.display = 'none';
        };
        window.filtrarBeneficiaris = function() {
            const q = document.getElementById('cerca-ben-input').value.toLowerCase().trim();
            const res = document.getElementById('cerca-ben-results');
            const expedients = window.BBDD?.expedients || [];
            if (!q) { res.innerHTML = '<p style="color:#94a3b8;padding:20px;text-align:center;">Escriu per cercar...</p>'; return; }
            if (!expedients.length) { res.innerHTML = '<p style="color:#94a3b8;padding:20px;text-align:center;">Carregant beneficiaris...</p>'; return; }
            const matches = expedients.filter(e => {
                const nom = `${e.nom||e.nombre||''} ${e.cognoms||e.apellidos||''}`.toLowerCase();
                return nom.includes(q) || (e.id||'').toLowerCase().includes(q) || (e.dni||'').toLowerCase().includes(q);
            }).slice(0, 12);
            if (!matches.length) {
                res.innerHTML = '<p style="color:#94a3b8;padding:20px;text-align:center;">Sense resultats.</p>';
                return;
            }
            res.innerHTML = matches.map(e => {
                const nom = `${e.nom||e.nombre||''} ${e.cognoms||e.apellidos||''}`.trim() || e.id;
                return `<div onclick="anarExpedientPsy('${e.id}','${encodeURIComponent(e.familia_id||e.familiaId||'')}')" style="display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-radius:10px;transition:.15s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background=''">
                    <div style="width:36px;height:36px;background:#ede9fe;color:#6366f1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;">${nom.charAt(0).toUpperCase()}</div>
                    <div><div style="font-weight:700;color:#1e293b;">${nom}</div><div style="font-size:.75rem;color:#94a3b8;">ID: ${e.id}${e.dni?' Â· '+e.dni:''}</div></div>
                    <svg style="margin-left:auto;color:#94a3b8;" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>`;
            }).join('');
        };
        window.anarExpedientPsy = function(id, famIdEnc) {
            window.location.href = `nexepsy-individu.html?id=${id}&familiaId=${famIdEnc}`;
        };
        async function _carregarBeneficiaris() {
            // Carregat diferidament pel mÃ²dul Firestore
            if (window._psyLoadBeneficiaris) await window._psyLoadBeneficiaris();
        }
    </script>

    <!-- CÃ rrega Firestore + desencriptaciÃ³ E2E (transparent, sense interacciÃ³) -->
    <script type="module">
        import { db } from '../firebase-config.js';
        import { collection, query, orderBy, getDocs, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
        import { waitForCrypto } from '../vault-init.js';
        import { decryptField } from '../crypto-utils.js';

        function showLoading() {
            document.getElementById('caseContainer').innerHTML = `
                <div style="grid-column:1/-1;padding:80px;text-align:center;color:#94a3b8;">
                    <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;"></div>
                    <div style="font-weight:700;font-size:.95rem;">Carregant expedients...</div>
                </div>
                <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
        }

        async function dec(v) { try { return await decryptField(v); } catch { return v; } }

        let _unsubFamilies = null;
        function carregarFamilies() {
            showLoading();
            _unsubFamilies = onSnapshot(
                query(collection(db, 'familias'), orderBy('fechaRegistro', 'desc')),
                async (snap) => {
                    try {
                        await waitForCrypto();
                        const families = await Promise.all(snap.docs.map(async d => {
                            const data = d.data();
                            const [apellido, notas, direccio] = await Promise.all([
                                dec(data.apellido || data.apellidos || data.nom || ''),
                                dec(data.notas || data.observaciones || ''),
                                dec(data.direcciÃ³n || data.direccion || ''),
                            ]);
                            return {
                                id: d.id,
                                apellido, notas, direccio,
                                estat: data.estado || 'activa',
                                programes: data.programasActivos || [],
                                miembres: data.miembrosTotal || 0
                            };
                        }));
                        window._psyFamilies = families;
                        cargarCasos(families);
                    } catch (e) {
                        console.error('[NexePsy] Error processant famÃ­lies:', e);
                    }
                },
                (e) => {
                    console.error('[NexePsy] Error carregant famÃ­lies:', e);
                    document.getElementById('caseContainer').innerHTML = `
                        <div style="grid-column:1/-1;padding:60px;text-align:center;">
                            <div style="font-weight:700;color:#ef4444;">Error carregant les dades</div>
                            <div style="font-size:.85rem;color:#94a3b8;margin-top:8px;">${e.message || 'Comprova la connexiÃ³.'}</div>
                            <button onclick="location.reload()" style="margin-top:16px;background:#6366f1;color:white;border:none;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer;">Recarregar</button>
                        </div>`;
                }
            );
        }
        window.addEventListener('beforeunload', () => { if (_unsubFamilies) _unsubFamilies(); });

        // CÃ rrega diferida de beneficiaris (per la cerca del modal)
        window._psyLoadBeneficiaris = async function() {
            if (window.BBDD?.expedients?.length) return;
            try {
                await waitForCrypto();
                const snap = await getDocs(collection(db, 'beneficiarios'));
                const bens = await Promise.all(snap.docs.map(async d => {
                    const data = d.data();
                    const [nom, cognoms, dni] = await Promise.all([
                        dec(data.nom || data.nombre || ''),
                        dec(data.cognoms || data.apellidos || ''),
                        dec(data.dni || ''),
                    ]);
                    return {
                        id: d.id,
                        nom, cognoms, dni,
                        familia_id: data.familia_id || data.familiaId || ''
                    };
                }));
                window.BBDD = { ...(window.BBDD || {}), expedients: bens };
                // Actualitzem si el modal ja tÃ© text
                const input = document.getElementById('cerca-ben-input');
                if (input?.value) window.filtrarBeneficiaris();
            } catch (e) {
                console.warn('[NexePsy] Error carregant beneficiaris:', e);
            }
        };

        carregarFamilies();
    </script>

    <!-- Modal: Cerca beneficiari per expedient psicosocial -->
    <div id="modal-cerca-ben" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.65);z-index:99999;justify-content:center;align-items:center;backdrop-filter:blur(4px);" onclick="if(event.target===this)closeBenSearch()">
        <div style="background:white;border-radius:24px;width:95%;max-width:520px;box-shadow:0 25px 50px -12px rgba(0,0,0,.4);overflow:hidden;">
            <div style="padding:24px 26px 0;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h3 style="margin:0;font-size:1rem;font-weight:800;color:#1e293b;">Expedient psicosocial â€” Cerca beneficiari</h3>
                    <button onclick="closeBenSearch()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#94a3b8;line-height:1;">Ã—</button>
                </div>
                <div style="display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;">
                    <svg fill="none" stroke="#94a3b8" viewBox="0 0 24 24" width="18" stroke-width="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"/></svg>
                    <input id="cerca-ben-input" type="text" placeholder="Nom, cognoms o ID del beneficiari..." oninput="filtrarBeneficiaris()" style="border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:.9rem;color:#1e293b;">
                </div>
            </div>
            <div id="cerca-ben-results" style="max-height:340px;overflow-y:auto;padding:8px 10px 16px;"></div>
        </div>
    </div>
</body>

<script type="module">
    // Carrega el badge de derivacions pendents i notificacions per a l'usuari actual
    import { db, auth } from '../firebase-config.js';
    import {
            collection, getDocs, query, where, updateDoc, doc, onSnapshot
        } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        let _unsubBadge = null;
        function loadPendentsBadge() {
            if (_unsubBadge) _unsubBadge();
            _unsubBadge = onSnapshot(
                query(collection(db, 'nexepsy/derivacions/solicituds'), where('estat','==','pendent')),
                (snap) => {
                    const count = snap.size;
                    const badge = document.getElementById('sidebar-espera-badge');
                    if (badge && count > 0) { badge.textContent = count; badge.style.display = ''; }
                    else if (badge) badge.style.display = 'none';
                },
                (e) => { /* no crÃ­tic */ }
            );
        }
        loadPendentsBadge();
        window.addEventListener('beforeunload', () => { if (_unsubBadge) _unsubBadge(); });
    async function loadNotificacionsUsuari() {
        const user = auth.currentUser;
        if (!user) return;
        try {
            const snap = await getDocs(query(
                collection(db, 'nexepsy_notificacions'),
                where('destinatari_uid','==', user.uid),
                where('llegida','==', false)
            ));
            if (snap.empty) return;
            snap.docs.forEach(async (d) => {
                const data = d.data();
                const banner = document.createElement('div');
                const isRebutjada = data.tipus === 'derivacio_rebutjada';
                banner.style.cssText = `position:fixed;top:20px;right:20px;z-index:9999;background:${isRebutjada ? '#fef2f2' : '#f0fdf4'};border:1.5px solid ${isRebutjada ? '#fca5a5' : '#86efac'};border-radius:14px;padding:16px 20px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-family:'Inter',sans-serif;`;
                banner.innerHTML = `
                    <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:${isRebutjada ? '#b91c1c' : '#166534'};margin-bottom:6px;">
                        ${isRebutjada
                            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> DerivaciÃ³ rebutjada'
                            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> DerivaciÃ³ acceptada'}
                    </div>
                    <div style="font-size:.83rem;color:#475569;line-height:1.5;">${data.text || ''}</div>
                    <button onclick="this.parentElement.remove()" style="position:absolute;top:10px;right:12px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#94a3b8;">Ã—</button>`;
                document.body.appendChild(banner);
                setTimeout(() => banner.remove(), 9000);
                // Marcar com llegida
                await updateDoc(doc(db, 'nexepsy_notificacions', d.id), { llegida: true });
            });
        } catch(e) { /* no crÃ­tic */ }
    }

    loadPendentsBadge();
    loadNotificacionsUsuari();
</script>
</html>
