<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>NexeSocial - Importador</title>
    <link rel="stylesheet" href="style-dashboard.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary: #1e293b; 
            --accent: #3b82f6; 
            --danger: #ef4444; 
            --border: #e2e8f0; 
}

        body { background: #f8fafc; font-family: 'Segoe UI', sans-serif; margin: 0; }

        .main-content { padding: 40px; box-sizing: border-box; }

        .import-card { 
            background: white; 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1200px;
        }

        /* Capçalera amb icona SVG */
        .header-import { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .header-import svg { width: 32px; height: 32px; color: var(--primary); }

        .drop-zone { 
            border: 2px dashed #cbd5e1; 
            padding: 60px; 
            text-align: center; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: 0.3s; 
            background: #fdfdfd; 
        }
        .drop-zone:hover { border-color: var(--accent); background: #f0f7ff; }

        /* Icones SVG per als botons */
        .btn-icon { width: 20px; height: 20px; fill: currentColor; }

        .mapping-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            margin: 25px 0; 
        }
        .map-card { background: #f8fafc; padding: 18px; border-radius: 12px; border: 1px solid var(--border); }
        .map-card label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        
        select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            background: white; 
            font-size: 0.9rem;
        }

        .action-buttons { 
            display: flex; 
            gap: 20px; 
            margin-top: 40px; 
            padding-top: 30px; 
            border-top: 1px solid var(--border); 
        }
        
        .btn-nexe {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            border: none;
        }

        .btn-primary { background: #0f172a; color: white; flex: 2; }
        .btn-primary:hover { background: #334155; }
        
        .btn-outline { background: white; color: var(--danger); border: 1px solid var(--danger); flex: 1; }
        .btn-outline:hover { background: #fef2f2; }

        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #f1f5f9; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <script type="module" src="sidebar.js"></script>

    <main class="main-content">
        <div class="import-card">
            
            <div class="header-import">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h1 style="margin:0">Importació de Dades</h1>
            </div>

            <div id="dropZone" class="drop-zone">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" style="margin-bottom:15px">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <p id="dropText"><b>Arrossega l'Excel aquí</b> o fes clic per buscar-lo</p>
                <input type="file" id="excelInput" style="display: none;" accept=".xlsx, .xls">
            </div>

            <div id="previewSection" style="display: none; margin-top: 40px;">
                <h3 style="display:flex; align-items:center; gap:10px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    Previsualització del fitxer
                </h3>
                
                <div class="table-container">
                    <table>
                        <thead><tr id="tableHeaders"></tr></thead>
                        <tbody><tr id="tableFirstRow"></tr></tbody>
                    </table>
                </div>

                <h3 style="margin-top:30px">Assignació de camps (Mapeig)</h3>
                <div class="mapping-grid" id="mappingContainer"></div>

                <div class="action-buttons">
                    <button class="btn-nexe btn-outline" onclick="location.reload()">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        Anul·lar
                    </button>
                    <button class="btn-nexe btn-primary" onclick="processData()">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        Confirmar i Processar
                    </button>
                </div>
            </div>
        </div>
    </main>

<script>
    const dropZone = document.getElementById('dropZone');
    const excelInput = document.getElementById('excelInput');
    const previewSection = document.getElementById('previewSection');
    let dadesExcel = [];

    const campsNexe = [
        { id: "nom", label: "Nom" },
        { id: "llinatge", label: "Primer Llinatge" },
        { id: "segon_llinatge", label: "Segon Llinatge" },
        { id: "dni", label: "DNI / NIE" },
        { id: "poblacio", label: "Població" }
    ];

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
        dropZone.addEventListener(e, (ev) => { ev.preventDefault(); ev.stopPropagation(); });
    });

    dropZone.onclick = () => excelInput.click();
    excelInput.onchange = e => handleFile(e.target.files[0]);
    dropZone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            dadesExcel = XLSX.utils.sheet_to_json(sheet);
            
            const cabeceres = Object.keys(dadesExcel[0]);
            renderUI(cabeceres);
        };
        reader.readAsArrayBuffer(file);
    }

    function renderUI(cabeceres) {
        document.getElementById('tableHeaders').innerHTML = cabeceres.map(h => `<th>${h}</th>`).join('');
        document.getElementById('tableFirstRow').innerHTML = cabeceres.map(h => `<td>${dadesExcel[0][h] || ''}</td>`).join('');
        
        document.getElementById('mappingContainer').innerHTML = campsNexe.map(camp => {
            return `
                <div class="map-card">
                    <label>${camp.label}</label>
                    <select class="map-select" data-nexe="${camp.id}">
                        <option value="">-- Ignorar --</option>
                        ${cabeceres.map(h => `<option value="${h}">${h}</option>`).join('')}
                    </select>
                </div>
            `;
        }).join('');

        previewSection.style.display = 'block';
        dropZone.style.display = 'none';
    }

    function processData() {
        alert("Dades processades. Revisa la consola.");
        console.log(dadesExcel);
    }
</script>
</body>
</html>
